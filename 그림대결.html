<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>그림대결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper2:#F3ECDC;
    --ink:#26241F;
    --coral:#FF6F59;
    --coral-d:#E5573F;
    --teal:#17A398;
    --teal-d:#0F857B;
    --yellow:#FFC93C;
    --line:#26241F;
    --shadow: rgba(38,36,31,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,111,89,0.07), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(23,163,152,0.08), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  .heading, h1,h2,h3, .btn, .timer-num{
    font-family:'Gaegu', cursive;
  }
  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .screen{
    display:none;
    width:100%;
    max-width:520px;
    animation: fadeUp .35s ease;
  }
  .screen.active{ display:block; }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{
    position:relative;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:18px;
    padding:32px 26px;
    box-shadow: 6px 6px 0 var(--shadow);
    transform: rotate(-0.4deg);
  }
  .tape{
    position:absolute;
    width:70px; height:26px;
    background: rgba(255,201,60,0.85);
    border:1px solid rgba(38,36,31,0.3);
    top:-14px;
  }
  .tape.left{ left:24px; transform:rotate(-8deg); }
  .tape.right{ right:24px; transform:rotate(6deg); background:rgba(255,111,89,0.6);}
  .logo{
    text-align:center;
    font-size:2.6rem;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  .logo span{ color:var(--coral); }
  .sub{
    text-align:center;
    color:#6b675e;
    font-size:0.95rem;
    margin:0 0 26px;
    line-height:1.6;
  }
  .btn{
    display:block;
    width:100%;
    font-size:1.3rem;
    padding:14px 18px;
    border-radius:14px;
    border:3px solid var(--ink);
    background:var(--yellow);
    color:var(--ink);
    cursor:pointer;
    box-shadow: 4px 4px 0 var(--ink);
    margin-bottom:14px;
    transition: transform .08s ease, box-shadow .08s ease;
    text-align:center;
  }
  .btn:active{
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .btn.coral{ background:var(--coral); color:#fff; }
  .btn.teal{ background:var(--teal); color:#fff; }
  .btn.ghost{ background:#fff; box-shadow:none; border:2px dashed var(--ink); font-size:1rem; padding:10px; color:#555; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:2px 2px 0 var(--ink); }

  .player-tag{
    display:inline-block;
    padding:6px 18px;
    border-radius:20px;
    font-size:1.4rem;
    border:3px solid var(--ink);
    margin:0 auto 14px;
  }
  .player-tag.p1{ background:var(--coral); color:#fff; }
  .player-tag.p2{ background:var(--teal); color:#fff; }
  .center{ text-align:center; }

  .word-badge{
    text-align:center;
    margin-bottom:14px;
  }
  .word-badge .label{ font-size:0.8rem; color:#8a8578; }
  .word-badge .word{
    font-size:2.2rem;
    font-weight:700;
    background: linear-gradient(180deg, transparent 60%, var(--yellow) 60%);
    display:inline-block;
    padding:0 6px;
  }

  .timer-row{
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .timer-num{
    font-size:1.6rem;
    background:var(--ink);
    color:var(--yellow);
    border-radius:50%;
    width:52px; height:52px;
    display:flex; align-items:center; justify-content:center;
  }

  canvas{
    width:100%;
    aspect-ratio:1/1;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    touch-action:none;
    display:block;
    margin-bottom:14px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .swatch{
    width:30px;height:30px;border-radius:50%;
    border:2px solid var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  .swatch.active{ box-shadow: 0 0 0 3px var(--yellow); }
  .tool-btn{
    padding:8px 12px;
    border-radius:10px;
    border:2px solid var(--ink);
    background:#fff;
    font-family:'Noto Sans KR';
    font-size:0.85rem;
    cursor:pointer;
  }
  .tool-btn.active{ background:var(--ink); color:#fff; }

  .countdown-overlay{
    position:absolute; inset:0;
    background:rgba(251,246,236,0.94);
    display:flex; align-items:center; justify-content:center;
    font-size:5rem; font-family:'Gaegu';
    border-radius:14px;
    z-index:5;
  }
  .canvas-wrap{ position:relative; }

  .spinner-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:#6b675e; font-size:0.95rem; margin:20px 0;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;background:var(--teal);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2){ animation-delay:.15s; }
  .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,80%,100%{ transform: scale(0.6); opacity:.5;}
    40%{ transform: scale(1); opacity:1;}
  }

  .result-imgs{
    display:flex; gap:12px; margin-bottom:16px;
  }
  .result-img-box{
    flex:1;
    border:3px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:#fff;
  }
  .result-img-box img{ width:100%; display:block; }
  .result-img-box .who{
    text-align:center;
    font-size:0.85rem;
    padding:5px 0;
    font-weight:700;
    border-top:2px solid var(--ink);
  }
  .result-img-box.p1 .who{ background:rgba(255,111,89,0.25); }
  .result-img-box.p2 .who{ background:rgba(23,163,152,0.25); }
  .result-img-box.winner{ box-shadow: 0 0 0 4px var(--yellow); }
  .crown{ position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:1.6rem; z-index:2;}
  .comment{
    font-size:0.85rem;
    text-align:center;
    padding:6px 8px;
    color:#555;
  }
  .verdict{
    text-align:center;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:12px;
  }
  .row2{ display:flex; gap:10px; }
  .row2 .btn{ flex:1; }
  .hint{
    text-align:center;
    font-size:0.8rem;
    color:#9a9587;
    margin-top:4px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 홈 화면 -->
  <div class="screen active" id="screen-home">
    <div class="card">
      <div class="tape left"></div><div class="tape right"></div>
      <h1 class="logo">그림<span>대결</span> 🎨</h1>
      <p class="sub">기기 하나로 번갈아 그려요.<br>같은 제시어, 각자 60초, 그리고 AI 채점.<br>상대방 차례엔 내 그림은 안 보여요!</p>
      <button class="btn coral" onclick="startGame()">게임 시작하기</button>
    </div>
  </div>

  <!-- 차례 안내 화면 (교대) -->
  <div class="screen" id="screen-turn-intro">
    <div class="card center">
      <div class="tape left"></div><div class="tape right"></div>
      <div class="player-tag" id="turn-tag">선수1</div>
      <h2 style="font-size:1.4rem; margin-bottom:6px;" id="turn-title">기기를 들어주세요</h2>
      <p class="sub" id="turn-desc">준비되면 시작 버튼을 눌러주세요. 제시어는 시작하는 순간 공개돼요.</p>
      <button class="btn coral" id="turn-start-btn" onclick="beginDrawingTurn()">그리기 시작</button>
    </div>
  </div>

  <!-- 그리기 화면 -->
  <div class="screen" id="screen-draw">
    <div class="card">
      <div class="player-tag center" id="draw-player-tag" style="display:block; margin:0 auto 10px; width:fit-content;">선수1</div>
      <div class="word-badge">
        <div class="label">제시어</div>
        <div class="word" id="draw-word">???</div>
      </div>
      <div class="timer-row">
        <div class="timer-num" id="draw-timer">60</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="draw-canvas" width="480" height="480"></canvas>
        <div class="countdown-overlay" id="countdown-overlay" style="display:none;"></div>
      </div>
      <div class="toolbar" id="color-swatches"></div>
      <div class="toolbar">
        <button class="tool-btn" id="brush-thin" onclick="setBrush(4)">얇게</button>
        <button class="tool-btn active" id="brush-med" onclick="setBrush(9)">보통</button>
        <button class="tool-btn" id="brush-thick" onclick="setBrush(16)">굵게</button>
        <button class="tool-btn" id="eraser-btn" onclick="toggleEraser()">지우개</button>
        <button class="tool-btn" onclick="clearCanvas()">전체지우기</button>
      </div>
      <button class="btn coral" id="submit-btn" onclick="submitDrawing()">제출하기</button>
    </div>
  </div>

  <!-- 채점 화면 -->
  <div class="screen" id="screen-judging">
    <div class="card center">
      <div class="tape left"></div><div class="tape right"></div>
      <h2 class="logo" style="font-size:1.6rem;">AI가 그림을 채점하고 있어요</h2>
      <div class="spinner-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <p class="hint">잠시만 기다려주세요 🖌️</p>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="card">
      <div class="tape left"></div><div class="tape right"></div>
      <div class="word-badge">
        <div class="label">제시어</div>
        <div class="word" id="result-word">???</div>
      </div>
      <div class="verdict" id="result-verdict">결과 발표!</div>
      <div class="result-imgs" id="result-imgs"></div>
      <div class="row2">
        <button class="btn teal" onclick="playAgain()">다시하기</button>
        <button class="btn ghost" onclick="goHome()">처음으로</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------------- 제시어 목록 ---------------- */
const WORDS = ["문어","선인장","팝콘","우산","치약","드론","피아노","자전거","토스트","해바라기",
"번개","소방차","양말","고래","아이스크림","사다리","거북이","카메라","모기","피자",
"달팽이","풍선","안경","로봇","케이크","불꽃놀이","연필","햄버거","축구공","눈사람",
"우주인","귀신","마이크","감자튀김","바나나","공룡","유령","미끄럼틀","오징어","치킨",
"신호등","폭포","에스컬레이터","손전등","악어","달","잠수함","딸기","별","가위",
"솜사탕","풍차","모래시계","닭","호랑이","박쥐","트램펄린","마술사","해적","성",
"용","왕관","망원경","도넛","초밥","젓가락","낙타","도깨비","비행기","미라",
"나무","구름","무지개","열쇠","시계","냉장고","선풍기","전구","우체통","지갑",
"신발","모자","장갑","목도리","배낭","텐트","캠프파이어","낚싯대","그네","시소",
"분수","온도계","저울","계단","창문","문","의자","책상","침대","거울"];

const COLORS = ["#26241F","#FF6F59","#17A398","#FFC93C","#3B6FD6","#9B59B6","#FFFFFF"];

/* ---------------- 상태 (전부 로컬, 서버/스토리지 없음) ---------------- */
let currentWord = null;
let currentPlayer = 1; // 1 또는 2
let player1Image = null;
let player2Image = null;
let tickTimer = null;
let localSubmitted = false;
let canvas, ctx;
let drawing = false;
let currentColor = COLORS[0];
let currentWidth = 9;
let isErasing = false;

/* ---------------- 화면 전환 ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){
  if(tickTimer) clearInterval(tickTimer);
  player1Image = null; player2Image = null;
  showScreen('screen-home');
}

/* ---------------- 게임 시작 ---------------- */
function startGame(){
  currentWord = WORDS[Math.floor(Math.random()*WORDS.length)];
  currentPlayer = 1;
  player1Image = null; player2Image = null;
  showTurnIntro();
}

function showTurnIntro(){
  const tag = document.getElementById('turn-tag');
  const title = document.getElementById('turn-title');
  const desc = document.getElementById('turn-desc');
  const btn = document.getElementById('turn-start-btn');
  tag.textContent = '선수' + currentPlayer;
  tag.className = 'player-tag ' + (currentPlayer===1 ? 'p1' : 'p2');
  if(currentPlayer === 1){
    title.textContent = '선수1, 준비되셨나요?';
    desc.textContent = '시작 버튼을 누르면 제시어가 공개되고 3초 후 60초 그리기가 시작돼요.';
    btn.className = 'btn coral';
  } else {
    title.textContent = '기기를 선수2에게 건네주세요';
    desc.textContent = '선수1의 그림은 보이지 않아요. 같은 제시어로 60초 그리게 돼요. 준비되면 시작!';
    btn.className = 'btn teal';
  }
  showScreen('screen-turn-intro');
}

function beginDrawingTurn(){
  localSubmitted = false;
  showScreen('screen-draw');
  document.getElementById('draw-word').textContent = currentWord;
  const tag = document.getElementById('draw-player-tag');
  tag.textContent = '선수' + currentPlayer + ' 차례';
  tag.className = 'player-tag center ' + (currentPlayer===1 ? 'p1' : 'p2');
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = '제출하기';
  document.getElementById('submit-btn').className = 'btn ' + (currentPlayer===1 ? 'coral' : 'teal');
  setupCanvasIfNeeded();
  clearCanvas();
  buildSwatches();
  startTicking(Date.now() + 3000);
}

function startTicking(startTime){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(()=>{ tick(startTime); }, 200);
  tick(startTime);
}

function tick(startTime){
  const now = Date.now();
  const overlay = document.getElementById('countdown-overlay');
  const timerEl = document.getElementById('draw-timer');
  const elapsed = now - startTime;
  if(elapsed < 0){
    overlay.style.display = 'flex';
    overlay.textContent = Math.ceil(-elapsed/1000);
    timerEl.textContent = '60';
    return;
  }
  overlay.style.display = 'none';
  const remain = Math.max(0, Math.ceil((60000 - elapsed)/1000));
  timerEl.textContent = remain;
  if(remain <= 0 && !localSubmitted){
    submitDrawing(true);
  }
}

/* ---------------- 캔버스 드로잉 ---------------- */
function setupCanvasIfNeeded(){
  if(canvas) return;
  canvas = document.getElementById('draw-canvas');
  ctx = canvas.getContext('2d');
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  function start(e){
    if(localSubmitted) return;
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function move(e){
    if(!drawing || localSubmitted) return;
    const p = getPos(e);
    ctx.strokeStyle = isErasing ? '#FFFFFF' : currentColor;
    ctx.lineWidth = isErasing ? currentWidth*2.2 : currentWidth;
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function end(){ drawing = false; }

  canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId); start(e); });
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointerleave', end);
}

function clearCanvas(){
  if(!ctx) return;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,canvas.width, canvas.height);
}

function buildSwatches(){
  const wrap = document.getElementById('color-swatches');
  wrap.innerHTML = '';
  COLORS.forEach((c)=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c===currentColor && !isErasing ? ' active' : '');
    sw.style.background = c;
    if(c === '#FFFFFF') sw.style.boxShadow = 'inset 0 0 0 1px #ccc';
    sw.onclick = ()=>{ currentColor = c; isErasing = false; document.getElementById('eraser-btn').classList.remove('active'); buildSwatches(); };
    wrap.appendChild(sw);
  });
}

function setBrush(w){
  currentWidth = w;
  ['brush-thin','brush-med','brush-thick'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(w===4) document.getElementById('brush-thin').classList.add('active');
  if(w===9) document.getElementById('brush-med').classList.add('active');
  if(w===16) document.getElementById('brush-thick').classList.add('active');
}

function toggleEraser(){
  isErasing = !isErasing;
  document.getElementById('eraser-btn').classList.toggle('active', isErasing);
  buildSwatches();
}

/* ---------------- 제출 (턴 전환) ---------------- */
function submitDrawing(auto){
  if(localSubmitted) return;
  localSubmitted = true;
  if(tickTimer) clearInterval(tickTimer);
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').textContent = auto ? '시간 종료!' : '제출 완료 ✅';

  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  if(currentPlayer === 1){
    player1Image = dataUrl;
    currentPlayer = 2;
    setTimeout(()=>{ showTurnIntro(); }, 500);
  } else {
    player2Image = dataUrl;
    setTimeout(()=>{ runJudging(); }, 500);
  }
}

/* ---------------- AI 채점 ---------------- */
async function runJudging(){
  showScreen('screen-judging');
  try{
    const body = {
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      system: "당신은 그림 대결 게임의 심판입니다. 제시어는 '"+currentWord+"'입니다. 선수1과 선수2가 각자 60초 동안 이 제시어를 그렸습니다. 두 그림을 비교해서 어느 그림이 제시어를 더 잘, 더 재미있게, 더 알아보기 쉽게 표현했는지 판단하세요. 그림 실력의 정교함보다 제시어 표현력과 재치를 중시하세요. 반드시 아래 JSON 형식으로만 답하세요. 다른 설명, 코드블록, 인사말은 절대 포함하지 마세요. {\"winner\": \"player1\" 또는 \"player2\" 또는 \"tie\", \"comment1\": \"선수1 그림에 대한 재치있고 따뜻한 한국어 한 줄 코멘트(이모지 1개 가능)\", \"comment2\": \"선수2 그림에 대한 재치있고 따뜻한 한국어 한 줄 코멘트(이모지 1개 가능)\"}",
      messages: [{
        role: "user",
        content: [
          {type:"text", text:"선수1의 그림:"},
          {type:"image", source:{type:"base64", media_type:"image/jpeg", data: player1Image.split(',')[1]}},
          {type:"text", text:"선수2의 그림:"},
          {type:"image", source:{type:"base64", media_type:"image/jpeg", data: player2Image.split(',')[1]}}
        ]
      }]
    };

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('');
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    let parsed;
    try{ parsed = JSON.parse(clean); }
    catch(e){ parsed = {winner:'tie', comment1:'채점 중 문제가 생겼어요 🙏', comment2:'채점 중 문제가 생겼어요 🙏'}; }
    renderResult(parsed);
  }catch(e){
    console.error('채점 실패', e);
    renderResult({winner:'tie', comment1:'채점 중 오류가 발생했어요', comment2:'채점 중 오류가 발생했어요'});
  }
}

/* ---------------- 결과 화면 ---------------- */
function renderResult(parsed){
  showScreen('screen-result');
  document.getElementById('result-word').textContent = currentWord;

  const verdictEl = document.getElementById('result-verdict');
  if(parsed.winner === 'tie'){
    verdictEl.textContent = '무승부! 둘 다 잘 그렸어요 🤝';
  } else if(parsed.winner === 'player1'){
    verdictEl.textContent = '선수1 승리! 🎉';
  } else {
    verdictEl.textContent = '선수2 승리! 🎉';
  }

  const wrap = document.getElementById('result-imgs');
  wrap.innerHTML = '';
  [
    {key:'player1', label:'선수1', img:player1Image, cls:'p1'},
    {key:'player2', label:'선수2', img:player2Image, cls:'p2'}
  ].forEach(p=>{
    const isWinner = parsed.winner === p.key;
    const comment = p.key === 'player1' ? parsed.comment1 : parsed.comment2;
    const box = document.createElement('div');
    box.className = 'result-img-box ' + p.cls + (isWinner ? ' winner' : '');
    box.innerHTML =
      (isWinner ? '<div class="crown">👑</div>' : '') +
      '<img src="'+ p.img +'">' +
      '<div class="who">'+ p.label +'</div>' +
      '<div class="comment">'+ (comment || '') +'</div>';
    wrap.appendChild(box);
  });
}

/* ---------------- 다시하기 ---------------- */
function playAgain(){
  startGame();
}

/* ---------------- 초기화 ---------------- */
buildSwatches();
</script>
